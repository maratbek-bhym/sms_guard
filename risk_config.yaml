# Параметры Risk Score. Изменение файла меняет расчёт без правки кода (конфиг перечитывается при смене mtime).
weights: {sms: 0.5, url: 0.2, se: 0.8}   # w1, w2, w3: подобраны на validation (data/reports/risk_calibration.json); начальные из ТЗ: 0.5/0.3/0.2
se_saturation_groups: 3                  # S_se = min(k / 3, 1)
levels: {medium_min: 35, high_min: 70}   # низкий 0-34, средний 35-69, высокий 70-100
url_t2: 0.543                            # порог DANGEROUS из url_model_meta.json (подбирался на validation)
overrides:
  code_request_min: 70
  sms_url_combo: {p_sms_min: 0.8, min_score: 85}
  url_ip_or_punycode_min: 60
mitigation:                              # законное предупреждение «никому не сообщайте код»
  code_warning_penalty: 20
  apply_only_without_url: true
reasons_max: 6
disclaimer: "Оценка носит вероятностный характер и не гарантирует безопасность"
